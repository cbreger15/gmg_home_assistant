name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parsing-tests:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run protocol parsing tests
        run: python tests/test_gmg_parsing.py
      - name: Run Grill Config tests
        run: python tests/test_gmg_config.py
      - name: Run finish-time tests
        run: python tests/test_analytics.py

  ha-tests:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.9 needs Python 3.14.2 or later.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.test.txt
      - name: Install Home Assistant's custom-component test harness
        run: pip install -r requirements.test.txt
      - name: Run every test, entities included
        run: python -m pytest

  syntax-check:
    name: Syntax check every module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile-check all Python files
        run: |
          for f in custom_components/gmg/*.py; do
            python -m py_compile "$f"
          done
